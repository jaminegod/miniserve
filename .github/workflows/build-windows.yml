name: Build Windows release (native MSVC)

on:
  # push:
  #   branches: ["main", "master"]
  # pull_request:
  #   branches: ["main", "master"]
  workflow_dispatch: {}

env:
  RUST_TOOLCHAIN: stable

jobs:
  build-msvc:
    name: Build (MSVC) on windows-latest (native .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment (debug)
        run: |
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Initial RUSTFLAGS: <$env:RUSTFLAGS>"
          rustc --version
          cargo --version
        shell: pwsh

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            %USERPROFILE%\.cargo\registry
            %USERPROFILE%\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: clippy

      - name: Build (release) with safe size-friendly flags (MSVC)
        run: |
          # Remove any embedded-bitcode flag that may be present in RUSTFLAGS
          $env:RUSTFLAGS = ($env:RUSTFLAGS -replace '-C embed-bitcode=no','').Trim()
          # Add size-friendly flags but avoid -C lto to prevent embed-bitcode conflicts
          $env:RUSTFLAGS = ($env:RUSTFLAGS + ' -C opt-level=z -C codegen-units=1').Trim()
          Write-Host "Effective RUSTFLAGS: <$env:RUSTFLAGS>"
          # Build release (native MSVC). This produces .exe and optional .pdb files.
          cargo build --release --locked
        shell: pwsh

      - name: Collect .exe, remove PDBs, optionally compress with UPX
        run: |
          # Prepare artifact dir
          if (Test-Path release_artifacts) { Remove-Item -Recurse -Force release_artifacts -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path release_artifacts | Out-Null

          # Copy top-level .exe files from target\release (avoid deps/pdb etc.)
          Get-ChildItem -Path target\release -File -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Extension -ieq '.exe' -or $_.BaseName -ieq 'miniserve') {
              Write-Host "Copying $($_.FullName)"
              Copy-Item -Path $_.FullName -Destination release_artifacts -Force
            }
          }

          # If crate binary uses non-standard name, attempt to copy by common names
          if (-Not (Get-ChildItem -Path release_artifacts -Filter *.exe -File -ErrorAction SilentlyContinue)) {
            Write-Host "No .exe found in release_artifacts; attempting fallback copy"
            if (Test-Path target\release\miniserve.exe) {
              Copy-Item -Path target\release\miniserve.exe -Destination release_artifacts -Force
            } elseif (Test-Path target\release\miniserve) {
              Copy-Item -Path target\release\miniserve -Destination release_artifacts -Force
            }
          }

          # Remove PDB files to reduce upload size (keep them out of artifact)
          Get-ChildItem -Path release_artifacts -Filter *.pdb -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # OPTIONAL: compress executables with UPX (comment out if not desired)
          # UPX can reduce size but may trigger AV false positives.
          # Uncomment the block below to enable UPX (attempts to install via choco).
          # if (-Not (Get-Command upx -ErrorAction SilentlyContinue)) {
          #   Write-Host "Installing upx (optional)..."
          #   choco install upx.portable -y || Write-Host "choco install upx failed or not available"
          # }
          # if (Get-Command upx -ErrorAction SilentlyContinue) {
          #   Get-ChildItem -Path release_artifacts -Filter *.exe -File | ForEach-Object {
          #     Write-Host "UPX compressing $($_.FullName)"
          #     upx --best --lzma $_.FullName || Write-Host "UPX failed for $($_.FullName)"
          #   }
          # } else {
          #   Write-Host "UPX not available; skipping compression"
          # }

          Write-Host "Artifact files (pre-zip):"
          Get-ChildItem -Path release_artifacts | Select-Object Name, @{Name='KB';Expression={[math]::Round($_.Length/1KB,2)}}
        shell: pwsh

      - name: Create zip from artifact dir (zip will contain files, not the outer folder)
        run: |
          if (-Not (Test-Path release_artifacts)) {
            Write-Host "No artifacts to zip"; exit 0
          }
          if (Test-Path miniserve-windows-msvc.zip) { Remove-Item miniserve-windows-msvc.zip -Force -ErrorAction SilentlyContinue }
          # Compress-Archive with release_artifacts\* will include files without adding outer folder
          Compress-Archive -Path release_artifacts\* -DestinationPath miniserve-windows-msvc.zip -Force
          Write-Host "Created zip: miniserve-windows-msvc.zip"
          Get-Item miniserve-windows-msvc.zip | Select-Object Name, @{Name='KB';Expression={[math]::Round($_.Length/1KB,2)}}
        shell: pwsh

      - name: Sanity: list zip entries (optional, best-effort)
        run: |
          if (Test-Path miniserve-windows-msvc.zip) {
            Write-Host "Zip size:"; Get-Item miniserve-windows-msvc.zip | Select-Object Name, @{Name='KB';Expression={[math]::Round($_.Length/1KB,2)}}
          } else {
            Write-Host "No zip found"
          }
        shell: pwsh

      - name: Upload release artifact (zip only)
        uses: actions/upload-artifact@v4
        with:
          name: miniserve-windows-msvc
          path: miniserve-windows-msvc.zip
