# Build Linux release (Ubuntu / generic Linux)
# Saves only final binaries (not the whole target dir) and applies size optimizations.
name: Build Linux release

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Build on Ubuntu (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: clippy

      - name: Show rust & cargo versions
        run: |
          rustc --version
          cargo --version

      - name: Build (release) with size optimizations
        env:
          # Temporary per-run optimizations (don't require changing Cargo.toml)
          RUSTFLAGS: -C lto=yes -C opt-level=z -C codegen-units=1
        run: cargo build --release --locked

      - name: Copy final executables to artifact dir and strip
        run: |
          set -e
          mkdir -p release_artifacts
          echo "Finding top-level executables in target/release (no deps/ subdirs)..."
          # Copy only top-level executable files (avoid copying deps, *.rlib, debug files)
          find target/release -maxdepth 1 -type f -executable -print0 | while IFS= read -r -d '' bin; do
            echo "Copying $bin"
            cp "$bin" release_artifacts/ || true
          done
          # On some runners binaries are not marked executable; also copy by common names (optional)
          # Strip the copied binaries to reduce size
          for f in release_artifacts/* ; do
            if [ -f "$f" ]; then
              echo "File: $f"
              file "$f" || true
              echo "Stripping $f"
              strip "$f" || true
            fi
          done
          echo "Artifact dir size:"
          du -sh release_artifacts || true
          ls -lah release_artifacts || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniserve-linux-release
          path: release_artifacts/*

  build-static-musl:
    name: Build static (musl) for x86_64 (optional)
    runs-on: ubuntu-latest
    # If you don't need musl static builds you can remove this job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps (musl)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config build-essential

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Install Rust toolchain and add musl target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static binary (musl) with optimizations
        env:
          RUSTFLAGS: -C lto=yes -C opt-level=z -C codegen-units=1
          CC: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl --locked

      - name: Copy musl binary(s) to artifact dir and strip
        run: |
          set -e
          mkdir -p release_artifacts_musl
          echo "Finding top-level executables in target/x86_64-unknown-linux-musl/release..."
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -executable -print0 | while IFS= read -r -d '' bin; do
            echo "Copying $bin"
            cp "$bin" release_artifacts_musl/ || true
          done
          # Some musl builds might not mark as executable; include regular files with no extension
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f ! -name '*.d' -print0 | while IFS= read -r -d '' bin; do
            bn=$(basename "$bin")
            # copy if not already copied
            if [ ! -f "release_artifacts_musl/$bn" ]; then
              cp "$bin" release_artifacts_musl/ || true
            fi
          done
          for f in release_artifacts_musl/* ; do
            if [ -f "$f" ]; then
              echo "File: $f"
              file "$f" || true
              echo "Stripping $f"
              x86_64-linux-gnu-strip "$f" 2>/dev/null || strip "$f" || true
            fi
          done
          echo "Musl artifact dir size:"
          du -sh release_artifacts_musl || true
          ls -lah release_artifacts_musl || true

      - name: Upload musl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniserve-linux-musl
          path: release_artifacts_musl/*
