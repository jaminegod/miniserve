# Build Linux release (Ubuntu / generic Linux)
# Cleans possible conflicting RUSTFLAGS (embed-bitcode), uses size-friendly RUSTFLAGS (no -C lto),
# copies only final binaries to artifact dirs and strips them before upload.
name: Build Linux release

on:
  # push:
  #   branches: ["main", "master"]
  # pull_request:
  #   branches: ["main", "master"]
  workflow_dispatch: {}

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Build on Ubuntu (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment (debug)
        run: |
          echo "Runner: $RUNNER_OS"
          echo "Initial RUSTFLAGS: <$RUSTFLAGS>"
          rustc --version || true
          cargo --version || true

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: clippy

      - name: Build (release) with safe size optimizations
        run: |
          # Remove any embedded-bitcode flag that may be present in RUSTFLAGS
          export RUSTFLAGS="${RUSTFLAGS//-C embed-bitcode=no/}"
          # Add size-friendly flags but avoid -C lto to prevent conflicts with embed-bitcode
          export RUSTFLAGS="$RUSTFLAGS -C opt-level=z -C codegen-units=1"
          echo "Effective RUSTFLAGS: <$RUSTFLAGS>"
          cargo build --release --locked

      - name: Copy final executables to artifact dir and strip
        run: |
          set -e
          mkdir -p release_artifacts
          echo "Finding top-level executables in target/release (no deps/ subdirs)..."
          # Copy only top-level executable files (avoid copying deps, *.rlib, debug files)
          find target/release -maxdepth 1 -type f -print0 | while IFS= read -r -d '' bin; do
            # Heuristic: treat files with no extension or named like the crate as executables
            bn=$(basename "$bin")
            if [ -x "$bin" ] || [[ "$bn" != *.* ]]; then
              echo "Copying $bin"
              cp "$bin" release_artifacts/ || true
            fi
          done
          # As a fallback, also copy any file in target/release matching the crate name (miniserve)
          if [ -f target/release/miniserve ] && [ ! -f release_artifacts/miniserve ]; then
            cp target/release/miniserve release_artifacts/ || true
          fi
          # Strip the copied binaries to reduce size
          for f in release_artifacts/* ; do
            if [ -f "$f" ]; then
              echo "File: $f"
              file "$f" || true
              echo "Stripping $f"
              strip "$f" || true
            fi
          done
          echo "Artifact dir size:"
          du -sh release_artifacts || true
          ls -lah release_artifacts || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniserve-linux-release
          path: release_artifacts/*

  build-static-musl:
    name: Build static (musl) for x86_64 (optional)
    runs-on: ubuntu-latest
    # Remove this job if you don't need musl static builds.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment (musl debug)
        run: |
          echo "Runner: $RUNNER_OS"
          echo "Initial RUSTFLAGS: <$RUSTFLAGS>"
          rustc --version || true
          cargo --version || true

      - name: Install build deps (musl)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config build-essential

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Install Rust toolchain and add musl target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static binary (musl) with safe optimizations
        run: |
          # Clean embed-bitcode if present
          export RUSTFLAGS="${RUSTFLAGS//-C embed-bitcode=no/}"
          export RUSTFLAGS="$RUSTFLAGS -C opt-level=z -C codegen-units=1"
          echo "Effective RUSTFLAGS: <$RUSTFLAGS>"
          export CC=musl-gcc
          cargo build --release --target x86_64-unknown-linux-musl --locked

      - name: Copy musl binary(s) to artifact dir and strip
        run: |
          set -e
          mkdir -p release_artifacts_musl
          echo "Finding top-level files in target/x86_64-unknown-linux-musl/release..."
          # Copy likely final artifacts
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -print0 | while IFS= read -r -d '' bin; do
            bn=$(basename "$bin")
            # copy executable-like or no-extension files
            if [ -x "$bin" ] || [[ "$bn" != *.* ]]; then
              echo "Copying $bin"
              cp "$bin" release_artifacts_musl/ || true
            fi
          done
          # Fallback copy by crate name
          if [ -f target/x86_64-unknown-linux-musl/release/miniserve ] && [ ! -f release_artifacts_musl/miniserve ]; then
            cp target/x86_64-unknown-linux-musl/release/miniserve release_artifacts_musl/ || true
          fi
          for f in release_artifacts_musl/* ; do
            if [ -f "$f" ]; then
              echo "File: $f"
              file "$f" || true
              echo "Stripping $f"
              x86_64-linux-gnu-strip "$f" 2>/dev/null || strip "$f" || true
            fi
          done
          echo "Musl artifact dir size:"
          du -sh release_artifacts_musl || true
          ls -lah release_artifacts_musl || true

      - name: Upload musl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniserve-linux-musl
          path: release_artifacts_musl/*
